[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarked-prediction-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "yfinance>=0.2",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
prediction-bot = "prediction_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prediction_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["prediction_bot"]
omit = ["prediction_bot/__init__.py"]
